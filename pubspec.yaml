
name: code_serure
description: "Application SecurePass de gestion des mots de passe."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_secure_storage_platform_interface: ^2.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# Icône de l'application
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

# Splash Screen : logo sur fond blanc
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/app_icon.png
  android: true
  ios: true
  web: false
  fullscreen: true

android_12:
    color: "#FFFFFF"
    image: assets/images/app_icon.png
    icon_background_color: "#FFFFFF"
    # Réduit la zone occupée par le logo
    image_dark: assets/images/app_icon.png

# Configuration Flutter
flutter:
  uses-material-design: true

  assets:
    - assets/images/app_icon.png